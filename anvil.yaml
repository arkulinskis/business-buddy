metadata:
  description: 'How to open a small business in Montréal, step by step: barber shop, bakery, café, cleaning, trades and more.
    Permits, taxes, costs and a personal launch plan.'
  logo_img: asset:icon-512.png
  title: 'Business Buddy: start a small business in Montréal'
name: Business Buddy
